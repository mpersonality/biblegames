<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Story Adventures</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#FBF6E8; font-family:'Inter',sans-serif; min-height:100vh; padding:24px; }
  .wrap { max-width:400px; margin:0 auto; }
  .hidden { display:none !important; }
  .header { text-align:center; margin-bottom:24px; }
  .header h1 { font-family:'Space Grotesk',sans-serif; font-size:20px; color:#5A4A2A; }
  .header p { font-size:12px; color:#8A7A5A; margin-top:4px; }
  .story-btn { display:flex; align-items:center; justify-content:space-between; background:#fff; border:2px solid #F0E0B8; border-radius:16px; padding:16px; margin-bottom:12px; cursor:pointer; width:100%; font-family:inherit; }
  .story-btn span { font-weight:700; font-size:14px; color:#5A4A2A; }
  .back-btn { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#8A7A5A; background:none; border:none; cursor:pointer; margin-bottom:16px; }
  .story-title { text-align:center; font-family:'Space Grotesk',sans-serif; font-size:18px; color:#5A4A2A; margin-bottom:16px; }
  .story-image { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:16px; border:3px solid #F0E0B8; margin-bottom:16px; display:block; }
  .story-image.hidden { display:none; }
  .story-thumb { width:44px; height:44px; border-radius:12px; object-fit:cover; border:2px solid #F0E0B8; margin-right:12px; flex-shrink:0; }
  .story-card { background:#fff; border:3px solid #F0E0B8; border-radius:16px; padding:24px; margin-bottom:20px; }
  .story-card p { font-size:19px; line-height:2; color:#5A4A2A; letter-spacing:0.01em; }
  .primary-btn { width:100%; padding:14px; border-radius:12px; font-weight:700; font-size:14px; color:#fff; background:#E8B23D; border:none; cursor:pointer; }
  .q-meta { text-align:center; margin-bottom:16px; }
  .q-meta .cat { font-size:12px; font-weight:700; color:#E8B23D; }
  .q-meta .sub { font-size:10px; color:#8A7A5A; }
  .q-card { background:#fff; border:3px solid #F0E0B8; border-radius:16px; padding:24px; margin-bottom:20px; }
  .q-card p { font-size:19px; font-weight:700; text-align:center; color:#5A4A2A; line-height:1.6; }
  .opt { display:flex; align-items:center; justify-content:space-between; width:100%; padding:14px 16px; border-radius:12px; font-size:14px; font-weight:700; background:#fff; border:2px solid #F0E0B8; color:#5A4A2A; margin-bottom:10px; cursor:pointer; font-family:inherit; }
  .opt.correct { background:#E8F5E0; border-color:#7FBB5A; color:#4A7A2A; }
  .opt.wrong { background:#FAE5E5; border-color:#D88A8A; color:#A54A4A; }
  .complete-card { text-align:center; background:#fff; border:2px solid #E8B23D; border-radius:16px; padding:32px; }
  .complete-card .stars { font-size:28px; margin-bottom:12px; }
  .complete-card h2 { font-family:'Space Grotesk',sans-serif; font-size:18px; color:#5A4A2A; margin-bottom:4px; }
  .complete-card p { font-size:13px; color:#8A7A5A; margin-bottom:20px; }
  .stars-row { display:flex; gap:2px; }
</style>
</head>
<body>

<div class="wrap">

  <div id="view-menu">
    <div class="header">
      <div style="font-size:28px;">💛</div>
      <h1>Bible Story Adventures</h1>
      <p>Learn and play together</p>
    </div>
    <div id="story-list"></div>
  </div>

  <div id="view-story" class="hidden">
    <button class="back-btn" onclick="goMenu()">← Back</button>
    <div class="story-title" id="story-title-text"></div>
    <img id="story-image" class="story-image hidden" alt="" />
    <div class="story-card"><p id="story-text"></p></div>
    <button class="primary-btn" onclick="beginQuestions()">I'm Ready — Start Questions</button>
  </div>

  <div id="view-playing" class="hidden">
    <button class="back-btn" onclick="goMenu()">← Back</button>
    <div class="q-meta">
      <div class="cat" id="q-story-title"></div>
      <div class="sub" id="q-progress"></div>
    </div>
    <div class="q-card"><p id="q-text"></p></div>
    <div id="q-options"></div>
    <button class="primary-btn hidden" id="next-btn" onclick="nextQuestion()">Next Question</button>
  </div>

  <div id="view-complete" class="hidden">
    <div class="complete-card">
      <div class="stars">⭐⭐⭐</div>
      <h2>Great Job!</h2>
      <p id="complete-text"></p>
      <button class="primary-btn" style="width:auto;padding:10px 20px;" onclick="goMenu()">Choose Another Story</button>
    </div>
  </div>

</div>

    questions: [

      { q: "Where did the Samaritan take the hurt man?", options: ["Home", "An inn", "A river", "A market"], answer: 1 },

let storyIdx = 0, qIdx = 0, selected = null;

function renderMenu() {
  const list = document.getElementById('story-list');
  list.innerHTML = '';
  STORIES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'story-btn';
    btn.innerHTML = `<div style="display:flex;align-items:center;">${s.image ? `<img src="${s.image}" class="story-thumb" alt="" />` : ''}<span>${s.title}</span></div><span>⭐⭐⭐</span>`;
    btn.onclick = () => startStory(i);
    list.appendChild(btn);
  });
}

function showView(id) {
  ['view-menu','view-story','view-playing','view-complete'].forEach(v => document.getElementById(v).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function goMenu() { showView('view-menu'); }

function startStory(i) {
  storyIdx = i;
  document.getElementById('story-title-text').textContent = STORIES[i].title;
  document.getElementById('story-text').textContent = STORIES[i].story;
  const imgEl = document.getElementById('story-image');
  if (STORIES[i].image) { imgEl.src = STORIES[i].image; imgEl.alt = STORIES[i].title; imgEl.classList.remove('hidden'); }
  else { imgEl.classList.add('hidden'); imgEl.src = ''; }
  showView('view-story');
}

function beginQuestions() {
  qIdx = 0; selected = null;
  renderQuestion();
  showView('view-playing');
}

function renderQuestion() {
  const story = STORIES[storyIdx];
  const q = story.questions[qIdx];
  document.getElementById('q-story-title').textContent = story.title;
  document.getElementById('q-progress').textContent = `Question ${qIdx+1} of ${story.questions.length}`;
  document.getElementById('q-text').textContent = q.q;
  const optsDiv = document.getElementById('q-options');
  optsDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(i);
    optsDiv.appendChild(btn);
  });
  document.getElementById('next-btn').classList.add('hidden');
}

function handleAnswer(i) {
  if (selected !== null) return;
  selected = i;
  const q = STORIES[storyIdx].questions[qIdx];
  const opts = document.querySelectorAll('.opt');
  opts.forEach((btn, idx) => {
    if (idx === q.answer) btn.classList.add('correct');
    else if (idx === i) btn.classList.add('wrong');
  });
  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.remove('hidden');
  nextBtn.textContent = (qIdx + 1 >= STORIES[storyIdx].questions.length) ? 'Finish Story' : 'Next Question';
}

function nextQuestion() {
  const story = STORIES[storyIdx];
  if (qIdx + 1 >= story.questions.length) {
    document.getElementById('complete-text').textContent = `You learned about ${story.title}`;
    showView('view-complete');
  } else {
    qIdx++; selected = null;
    renderQuestion();
  }
}

renderMenu();
</script>
